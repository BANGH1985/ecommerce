openapi: 3.0.0
info:
  title: Carritos API
  description: API para gestionar carritos de compras en la tienda.
  version: 1.0.0
paths:
  /carts:
    post:
      summary: Crear un nuevo carrito
      tags:
        - Carritos
      responses:
        '201':
          description: Carrito creado con éxito.
        '500':
          description: Error al crear el carrito.
  /carts/{cid}:
    get:
      summary: Obtener un carrito por ID
      tags:
        - Carritos
      parameters:
        - name: cid
          in: path
          required: true
          description: ID del carrito
          schema:
            type: string
      responses:
        '200':
          description: Carrito obtenido con éxito.
        '404':
          description: Carrito no encontrado.
    delete:
      summary: Vaciar un carrito
      tags:
        - Carritos
      parameters:
        - name: cid
          in: path
          required: true
          description: ID del carrito
          schema:
            type: string
      responses:
        '200':
          description: Carrito vaciado con éxito.
        '404':
          description: Carrito no encontrado.
  /carts/{cid}/products/{pid}:
    post:
      summary: Agregar un producto al carrito
      tags:
        - Carritos
      parameters:
        - name: cid
          in: path
          required: true
          description: ID del carrito
          schema:
            type: string
        - name: pid
          in: path
          required: true
          description: ID del producto
          schema:
            type: string
      responses:
        '200':
          description: Producto agregado al carrito con éxito.
        '404':
          description: Carrito o producto no encontrado.
    delete:
      summary: Eliminar un producto del carrito
      tags:
        - Carritos
      parameters:
        - name: cid
          in: path
          required: true
          description: ID del carrito
          schema:
            type: string
        - name: pid
          in: path
          required: true
          description: ID del producto
          schema:
            type: string
      responses:
        '200':
          description: Producto eliminado del carrito con éxito.
        '404':
          description: Carrito o producto no encontrado.
  /carts/{cid}/purchase:
    get:
      summary: Realizar la compra de un carrito
      tags:
        - Carritos
      parameters:
        - name: cid
          in: path
          required: true
          description: ID del carrito
          schema:
            type: string
      responses:
        '200':
          description: Compra realizada con éxito.
        '404':
          description: Carrito no encontrado.
    post:
      summary: Pagar por el carrito
      tags:
        - Carritos
      parameters:
        - name: cid
          in: path
          required: true
          description: ID del carrito
          schema:
            type: string
      responses:
        '200':
          description: Pago realizado con éxito.
        '400':
          description: Error en el pago.
components:
  schemas:
    Cart:
      type: object
      properties:
        user:
          type: string
          description: ID del usuario asociado
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                description: ID del producto
              quantity:
                type: number
                description: Cantidad de productos
